  <defs>
    <!-- neon gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0CDFFA" />
      <stop offset="50%" stop-color="#05F2FA" />
      <stop offset="100%" stop-color="#705EF9" />
    </linearGradient>

    <!-- მსუბუქი glow -->
    <filter id="logoGlow" x="-0.5" y="-0.5" width="2" height="2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .stroke-main {
        fill: none;
        stroke: url(#logoGradient);
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .stroke-glow {
        fill: none;
        stroke: url(#logoGradient);
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.55;
        filter: url(#logoGlow);
      }

      .stroke-main-check {
        fill: none;
        stroke: url(#logoGradient);
        stroke-width: 16;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .stroke-glow-check {
        fill: none;
        stroke: url(#logoGradient);
        stroke-width: 26;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.7;
        filter: url(#logoGlow);
      }
    </style>
  </defs>

